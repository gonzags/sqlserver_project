adventureworks_analytics:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: 192.168.0.222
      port: 1433
      database: adventureworks_dw
      schema: dbo
      authentication: sql
      user: "{{ env_var('usr_pedro') }}"
      password: "{{ env_var('pwd_pedro') }}"
      trust_cert: true
      threads: 4